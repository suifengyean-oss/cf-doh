<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜拳小游戏</title>
<style>
    *{box-sizing:border-box;}

    html,body{height:100%;margin:0;}

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color:#f2f5ff;
        background: radial-gradient(circle at 20% 10%, #2c3e70, #1e2a4a 45%, #111827 100%);
        -webkit-user-select:none;
        user-select:none;
    }

    /* ===== 卡片 ===== */
    .game{
        width:min(560px, 100%);
        padding:26px 22px 22px;
        text-align:center;
        border-radius:24px;
        background:rgba(255,255,255,.07);
        border:1px solid rgba(255,255,255,.12);
        box-shadow:0 24px 60px rgba(0,0,0,.5);
        backdrop-filter:blur(8px);
    }

    h1{
        margin:0 0 18px;
        font-size:22px;
        font-weight:600;
        letter-spacing:3px;
        opacity:.95;
    }

    /* ===== 计分板 ===== */
    .scoreboard{
        display:flex;
        gap:10px;
        margin-bottom:18px;
    }

    .score{
        flex:1;
        padding:10px 4px;
        border-radius:14px;
        background:rgba(255,255,255,.06);
        border:1px solid rgba(255,255,255,.08);
    }

    .score .label{
        font-size:12px;
        letter-spacing:1px;
        opacity:.7;
    }

    .score .value{
        margin-top:2px;
        font-size:26px;
        font-weight:700;
        font-variant-numeric:tabular-nums;
    }

    .score.win  .value{color:#4ade80;}
    .score.lose .value{color:#f87171;}
    .score.draw .value{color:#fbbf24;}

    /* ===== 对战区 ===== */
    .arena{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:14px;
        margin:4px 0 6px;
    }

    .hand{
        width:118px;
        height:118px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:56px;
        line-height:1;
        border-radius:22px;
        background:rgba(255,255,255,.08);
        border:1px solid rgba(255,255,255,.1);
    }

    .hand.shaking{animation:shake .12s infinite;}
    .hand.pop{animation:pop .22s ease;}

    @keyframes shake{
        0%  {transform:translateY(0) rotate(-5deg);}
        50% {transform:translateY(-10px) rotate(5deg);}
        100%{transform:translateY(0) rotate(-5deg);}
    }

    @keyframes pop{
        0%  {transform:scale(.82);}
        60% {transform:scale(1.1);}
        100%{transform:scale(1);}
    }

    .vs{
        font-size:16px;
        font-weight:700;
        letter-spacing:1px;
        opacity:.5;
    }

    /* ===== 结果文字 ===== */
    .result{
        min-height:28px;
        margin:14px 0 18px;
        font-size:17px;
        font-weight:600;
        letter-spacing:.5px;
        opacity:.9;
    }

    .result.win  {color:#4ade80;}
    .result.lose {color:#f87171;}
    .result.draw {color:#fbbf24;}

    /* ===== 出拳按钮 ===== */
    .choices{
        display:flex;
        gap:12px;
        justify-content:center;
    }

    .choice{
        flex:1;
        max-width:150px;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:6px;
        padding:14px 6px;
        font-family:inherit;
        font-size:14px;
        color:#fff;
        cursor:pointer;
        border-radius:16px;
        border:1px solid rgba(255,255,255,.16);
        background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
        transition:transform .12s, box-shadow .12s, background .12s, opacity .12s;
    }

    .choice .emoji{font-size:32px;line-height:1;}

    .choice:hover:not(:disabled){
        transform:translateY(-4px);
        background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.1));
        box-shadow:0 12px 26px rgba(0,0,0,.35);
    }

    .choice:active:not(:disabled){transform:translateY(-1px) scale(.97);}

    .choice:disabled{
        opacity:.4;
        cursor:not-allowed;
    }

    /* ===== 重置 ===== */
    .reset{
        margin-top:20px;
        padding:8px 22px;
        font-family:inherit;
        font-size:13px;
        letter-spacing:1px;
        color:rgba(255,255,255,.75);
        cursor:pointer;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.25);
        background:transparent;
        transition:.15s;
    }

    .reset:hover{
        color:#fff;
        background:rgba(255,255,255,.12);
    }

    /* ===== 小屏适配 ===== */
    @media (max-width:480px){
        .game{padding:20px 14px 18px;}
        h1{font-size:19px;}
        .hand{width:92px;height:92px;font-size:44px;border-radius:18px;}
        .choice{font-size:12px;padding:11px 4px;}
        .choice .emoji{font-size:26px;}
        .result{font-size:15px;}
    }
</style>
</head>
<body>

<div class="game">
    <h1>猜 拳 小 游 戏</h1>

    <div class="scoreboard">
        <div class="score win">
            <div class="label">你 赢</div>
            <div class="value" id="winScore">0</div>
        </div>
        <div class="score draw">
            <div class="label">平 局</div>
            <div class="value" id="drawScore">0</div>
        </div>
        <div class="score lose">
            <div class="label">你 输</div>
            <div class="value" id="loseScore">0</div>
        </div>
    </div>

    <div class="arena">
        <div class="hand" id="playerHand">❔</div>
        <div class="vs">VS</div>
        <div class="hand" id="computerHand">❔</div>
    </div>

    <div class="result" id="result">选择一个手势开始吧！</div>

    <div class="choices">
        <button class="choice" data-move="rock" title="快捷键 R 或 1">
            <span class="emoji">✊</span>石头
        </button>
        <button class="choice" data-move="scissors" title="快捷键 S 或 2">
            <span class="emoji">✌️</span>剪刀
        </button>
        <button class="choice" data-move="paper" title="快捷键 P 或 3">
            <span class="emoji">✋</span>布
        </button>
    </div>

    <button class="reset" id="resetBtn">重新开始</button>
</div>

<script>
    /* ============ 数据 ============ */
    const MOVES = {
        rock:     { name: '石头', emoji: '✊', beats: 'scissors' },
        scissors: { name: '剪刀', emoji: '✌️', beats: 'paper'    },
        paper:    { name: '布',   emoji: '✋', beats: 'rock'     }
    };
    const KEYS = Object.keys(MOVES);

    /* ============ DOM ============ */
    const playerHand   = document.getElementById('playerHand');
    const computerHand = document.getElementById('computerHand');
    const resultEl     = document.getElementById('result');
    const choiceBtns   = document.querySelectorAll('.choice');
    const resetBtn     = document.getElementById('resetBtn');

    const scoreEls = {
        win:  document.getElementById('winScore'),
        lose: document.getElementById('loseScore'),
        draw: document.getElementById('drawScore')
    };

    /* ============ 状态 ============ */
    let scores  = { win: 0, lose: 0, draw: 0 };
    let playing = false;
    let timer   = null;

    /* ============ 工具函数 ============ */
    function setResult(text, cls) {
        resultEl.textContent = text;
        resultEl.className = 'result' + (cls ? ' ' + cls : '');
    }

    function renderScores() {
        scoreEls.win.textContent  = scores.win;
        scoreEls.lose.textContent = scores.lose;
        scoreEls.draw.textContent = scores.draw;
    }

    function randomMove() {
        return KEYS[Math.floor(Math.random() * KEYS.length)];
    }

    /* ============ 核心流程 ============ */
    function play(playerMove) {
        if (playing) return;
        playing = true;
        choiceBtns.forEach(b => b.disabled = true);

        // 展示玩家出拳
        playerHand.textContent = MOVES[playerMove].emoji;

        // 电脑“思考中”
        computerHand.classList.add('shaking');
        setResult('出拳中…', '');

        let ticks = 0;
        timer = setInterval(() => {
            computerHand.textContent = MOVES[randomMove()].emoji;
            ticks++;
            if (ticks >= 8) {
                clearInterval(timer);
                timer = null;
                finish(playerMove);
            }
        }, 70);
    }

    function finish(playerMove) {
        computerHand.classList.remove('shaking');

        const computerMove = randomMove();
        computerHand.textContent = MOVES[computerMove].emoji;

        let outcome;
        if (playerMove === computerMove) {
            outcome = 'draw';
        } else if (MOVES[playerMove].beats === computerMove) {
            outcome = 'win';
        } else {
            outcome = 'lose';
        }

        scores[outcome]++;
        renderScores();

        const pName = MOVES[playerMove].name;
        const cName = MOVES[computerMove].name;

        if (outcome === 'win') {
            setResult(`你出${pName}，电脑出${cName} —— 你赢了！🎉`, 'win');
        } else if (outcome === 'lose') {
            setResult(`你出${pName}，电脑出${cName} —— 电脑赢了 😵`, 'lose');
        } else {
            setResult(`双方都是${pName}，平局 🤝`, 'draw');
        }

        // 结果弹出动画
        computerHand.classList.add('pop');
        setTimeout(() => computerHand.classList.remove('pop'), 220);

        playing = false;
        choiceBtns.forEach(b => b.disabled = false);
    }

    function reset() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        playing = false;

        scores = { win: 0, lose: 0, draw: 0 };
        renderScores();

        playerHand.textContent   = '❔';
        computerHand.textContent = '❔';
        computerHand.classList.remove('shaking', 'pop');

        setResult('选择一个手势开始吧！', '');
        choiceBtns.forEach(b => b.disabled = false);
    }

    /* ============ 事件绑定 ============ */
    choiceBtns.forEach(btn => {
        btn.addEventListener('click', () => play(btn.dataset.move));
    });

    resetBtn.addEventListener('click', reset);

    // 键盘快捷键：R/1 石头，S/2 剪刀，P/3 布
    document.addEventListener('keydown', e => {
        const map = {
            'r': 'rock',     '1': 'rock',
            's': 'scissors', '2': 'scissors',
            'p': 'paper',    '3': 'paper'
        };
        const move = map[e.key.toLowerCase()];
        if (move) play(move);
    });

    /* ============ 初始化 ============ */
    renderScores();
</script>

</body>
</html>
